name: Dependabot auto-merge

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  check_suite:
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Wait for checks to complete
        uses: actions/github-script@v7
        with:
          script: |
            const pullNumber = context.payload.pull_request?.number || context.payload.check_suite?.pull_requests?.[0]?.number;
            if (!pullNumber) {
              console.log('No pull request number found');
              return;
            }

            // Get the PR details
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber
            });

            // Check if PR is already merged or not mergeable
            if (pr.merged) {
              console.log('PR already merged');
              return;
            }

            if (pr.mergeable !== true) {
              console.log('PR is not mergeable yet, waiting...');
              // The workflow will be triggered again when the PR becomes mergeable
              return;
            }

            // Check all required status checks have passed
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha,
              status: 'completed'
            });

            const allChecksPassed = checks.check_runs.every(check => check.conclusion === 'success');

            if (!allChecksPassed) {
              console.log('Not all checks have passed yet');
              return;
            }

            console.log('All checks passed, merging PR...');

            // Merge the PR
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
                merge_method: 'squash'
              });
              console.log('PR merged successfully');
            } catch (error) {
              // If already merged or conflict, just log
              console.log('Merge result:', error.message);
            }
